<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="keywords" content="RS Piscinas, limpeza de piscina, tratamento de piscina, manutenção de piscina, troca de areia, casa de maquinas, correção quimica" />
    <meta property="og:title" content="RS Piscinas - Tratamento, Limpeza e Manutenção de Piscinas" />
    <meta property="og:description" content="Água cristalina, saúde para sua família e equipamentos sempre conservados. Solicite um orçamento pelo WhatsApp com a RS Piscinas." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>RS Piscinas - Tratamento e Limpeza Profissional de Piscinas</title>
    <script>
      // Fallback auto-recovery if JS bundle fails to load (PWA cache issue)
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT' && e.target.src.includes('/assets/')) {
          console.error("Failed to load script, likely a stale cache. Forcing reload...");
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for(let registration of registrations) {
                registration.unregister();
              }
            });
          }
          if (!sessionStorage.getItem('reloaded_once')) {
            sessionStorage.setItem('reloaded_once', 'true');
            window.location.reload(true);
          }
        }
      }, true);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, (err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });

        // Notify SW to process queued offline requests when network is back
        window.addEventListener('online', () => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'SYNC_ONLINE' });
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
